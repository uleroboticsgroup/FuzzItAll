

######################################################################
### job blueprint
######################################################################
#SBATCH --partition=<partition_name>; partition to which the job is sent
#SBATCH --nodes=<minnode>[-maxnodes]; request that a minimum (and maximum) of nodes be allocated to this job
#SBATCH --ntasks=<number>; sets the number of cores desired for script execution
#SBATCH --tasks-per-node=<ntasks>; sets the maximum number of tasks per node
#SBATCH --qos=<qos>; QoS in which the job is sent
#SBATCH --time=<time>; time limit for the job (D-HH:MM:SS)


######################################################################
### notifications
######################################################################
#SBATCH --mail-user=<user>; e-mail address where notifications related to the job will be sent
#SBATCH --mail-type=<type>; defines under what circumstances an e-mail will be sent to the user


######################################################################
### required modules
######################################################################
module purge
# load the corresponding module with llvm and/or gcc available
# e.g.: module load partition_name/llvm_gcc_modules

