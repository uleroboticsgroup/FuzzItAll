<div id="content" style="text-align: center; width:100%; flex: auto; flex-wrap: wrap; margin-top: 20%; flex-direction: column;">
    <input type="text" id="username" placeholder="Username" style="font-size: 1em;">

<div id="logged_in" style="display: none; flex: auto; flex-direction: row; width: 100%;">
    <div id="content2" style="text-align: center; width: 40%; flex: auto; flex-wrap: wrap; margin-top: 13%; flex-direction: column;">
        <h2>Create job</h2>
        <input type="text" id="projectname" placeholder="Project Name" style="font-size: 1em;">
        <br>
        <input type="text" id="ssh-endpoint" placeholder="Git SSH URI"style="font-size: 1em;">
        <br>
        <button onclick="newProject()">Send</button>
    </div>

    <button style ="margin-top: 16%; height: 20px;"onclick="getJobsInformation()">Get Jobs</button>

    <div id="content3" style="text-align: center; width: 40%; flex: auto; flex-wrap: wrap; margin-top: 13%; flex-direction: column;">
        <h2>Job Information</h2>
        <input type="text" id="id" placeholder="ID" style="font-size: 1em;">
        <br>

<pre id="result" style="display: none; overflow: scroll; height: 400px; width: 80%; margin-left: 10%;  background-color: white; color: black; margin-top: 13%;">
    </pre>

<script>
    var token = ''
    function sendLogin() {
        var xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function () {
            if (this.readyState != 4) return;

            if (this.status == 200) {
                var data = JSON.parse(this.responseText);
                token = data['access_token']
                document.getElementById("content").style.display = "None"
                document.getElementById("logged_in").style.display = "flex"
                document.getElementById("result").style.display = "flex"

                // we get the returned data
            }

        // end of state change: it can be after some time (async)
        };
        xhr.open("POST", "http://localhost:9999/auth", true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify({
            "username": document.getElementById("username").value,
            "password": document.getElementById("password").value
        }));

        document.getElementById("username").value = ''
        document.getElementById("password").value = ''
    }

    function newProject() {
        var xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function () {
            if (this.readyState != 4) return;

            if (this.status == 200) {
                document.getElementById("result").innerHTML = this.responseText;

                // we get the returned data
            }

        // end of state change: it can be after some time (async)
        };
        xhr.open("POST", "http://localhost:9999/api/new_job", true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.setRequestHeader('Authorization', 'JWT ' + token);

        document.getElementById("result").innerHTML = "Sending job...";

        xhr.send(JSON.stringify({
            "project": document.getElementById("projectname").value,
            "git-ssh-endpoint": document.getElementById("ssh-endpoint").value
        }));

    }

    function checkStatus() {
        var xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function () {
            if (this.readyState != 4) return;

            if (this.status == 200) {
                document.getElementById("result").innerHTML = this.responseText;

                // we get the returned data
            }

        // end of state change: it can be after some time (async)
        };
        xhr.open("GET", "http://localhost:9999/api/status?id=" + document.getElementById("id").value, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.setRequestHeader('Authorization', 'JWT ' + token);

        xhr.send();

    }

    function saveBlob(blob, fileName) {
        var a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = fileName;
        a.dispatchEvent(new MouseEvent('click'));
    }

    function downloadResults() {
        var xhr = new XMLHttpRequest();

        xhr.onload = function (e) {
            var blob = e.currentTarget.response;
            var contentDispo = e.currentTarget.getResponseHeader('Content-Disposition');
            // https://stackoverflow.com/a/23054920/
            var fileName = contentDispo.match(/filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/)[1];
            saveBlob(blob, fileName);
        // end of state change: it can be after some time (async)
        };
        xhr.open("GET", "http://localhost:9999/api/results?id=" + document.getElementById("id").value, true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.setRequestHeader('Authorization', 'JWT ' + token);
        xhr.responseType = 'blob';
        xhr.send();

    }

    function getJobsInformation() {
        var xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function () {
            if (this.readyState != 4) return;

            if (this.status == 200) {
                document.getElementById("result").innerHTML = this.responseText;

                // we get the returned data
            }

        // end of state change: it can be after some time (async)
        };
        xhr.open("GET", "http://localhost:9999/api/status", true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.setRequestHeader('Authorization', 'JWT ' + token);
        xhr.send();

    }
